{% extends 'base.html' %}

{% block content %}
<style>
  .register-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: url("{{ url_for('static', filename='images/back1.jpg') }}") no-repeat center center;
    background-size: cover;
    position: relative;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    background: rgba(255, 255, 255, 0.65);
    z-index: 1;
  }

  .register-card {
    z-index: 2;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 420px;
  }

  .register-card h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #4a6cf7;
    font-size: 26px;
  }

  .register-card label,
  .register-card input,
  .register-card button,
  .register-card p {
    width: 100%;
    display: block;
  }

  .register-card input {
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 12px;
    border: 1px solid #ccc;
  }

  .register-card button {
    padding: 12px;
    background-color: #4a6cf7;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }

  .register-card button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0, 122, 255, 0.4);
  }

  .register-card p a {
    color: #4a6cf7;
    font-weight: bold;
    text-decoration: none;
  }
</style>

<div class="register-wrapper">
  <div class="overlay"></div>

  <div class="register-card">
    <h2>Create Your Fiora Account</h2>
    <form action="{{ url_for('register') }}" method="POST">
      <label for="username">Username</label>
      <input type="text" name="username" required>

      <label for="password">Password</label>
      <input type="password" name="password" required>

      <button type="submit">Register</button>
    </form>

    <p>Already have an account?
      <a href="{{ url_for('login') }}">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
