{% extends 'base.html' %}

{% block content %}
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    .thankyou-bg {
        background: url("{{ url_for('static', filename='images/back3.jpg') }}") no-repeat center center;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        animation: fadeIn 2s ease-out;
        text-align: center;
        padding: 40px 20px;
    }

    .thankyou-message h2 {
        color: black;
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 20px;
        animation: slideIn 1.5s ease-in-out;
    }

    .thankyou-message p {
        font-size: 22px;
        color: #ffffff;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
        margin-bottom: 35px;
        animation: fadeIn 3s ease-in;
    }

    .thankyou-message a {
        background: #007AFF;
        color: white;
        padding: 14px 32px;
        border-radius: 30px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
        transition: transform 0.2s ease;
        animation: fadeIn 3s ease-in;
    }

    .thankyou-message a:hover {
        transform: scale(1.07);
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes slideIn {
        from { transform: translateY(25px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
</style>

<main class="thankyou-bg">
    <section class="thankyou-message">
        <h2>Thank you for your feedback!</h2>
        <p>Your review means a lot to us and helps us grow.</p>
        <a href="{{ url_for('index') }}">Return to Home</a>
    </section>
</main>
{% endblock %}
