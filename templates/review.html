{% extends 'base.html' %}

{% block content %}
<style>
  .review-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: url("{{ url_for('static', filename='images/back1.jpg') }}") no-repeat center center;
    background-size: cover;
    position: relative;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    background: rgba(255, 255, 255, 0.65);
    z-index: 1;
  }

  .review-card {
    z-index: 2;
    background: white;
    padding: 50px;
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 700px;
    text-align: center;
  }

  .review-card h2 {
    font-size: 28px;
    color: #4a6cf7;
    margin-bottom: 20px;
  }

  .review-card p {
    font-size: 17px;
    color: #555;
    margin-bottom: 30px;
  }

  .review-card textarea {
    width: 100%;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
    resize: vertical;
    height: 180px;
    margin-bottom: 30px;
  }

  .review-card button {
    background: #4a6cf7;
    color: white;
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }

  .review-card button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0, 122, 255, 0.4);
  }
</style>

<div class="review-wrapper">
  <div class="overlay"></div>

  <div class="review-card">
    <h2>Your Glow-Up Story</h2>
    <p>
      Tell us how Fiora AI transformed your skincare journey.<br>
      Whether it’s clear skin, radiant glow, or confidence — we’re here for it!
    </p>
    <form action="/submit_review" method="post" style="display: flex; flex-direction: column; gap: 20px;">
        <label for="review_text" style="text-align: left; font-weight: bold; color: #333;">Your Review:</label>
        <textarea name="review_text" id="review_text" rows="6" required placeholder="Write something beautiful..."></textarea>
        <button type="submit">Submit Review</button>
    </form>
  </div>
</div>
{% endblock %}
